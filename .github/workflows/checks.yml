# Pull-request checks: Conventional Commit PR title, pre-commit and Semgrep on the code a change touches.
# The full BDD suite for this app runs in SatatTech/Satat_fca (it installs all Satat apps).
name: Checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: pre-commit and Semgrep on changed code
        run: |
          pip install pre-commit semgrep
          BASE=${{ github.event.pull_request.base.sha || 'HEAD~1' }}
          if [ -f .pre-commit-config.yaml ]; then pre-commit run --show-diff-on-failure --from-ref "$BASE" --to-ref HEAD; fi
          git clone --depth 1 https://github.com/frappe/semgrep-rules.git /tmp/frappe-semgrep-rules
          semgrep scan --metrics=off --error --config /tmp/frappe-semgrep-rules/rules --baseline-commit "$BASE" nextiq
