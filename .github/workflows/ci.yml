name: CI

on:
  push:
    branches:
      - main
      - dev-v2

  pull_request:
    branches:
      - main
      - dev-v2

concurrency:
  group: ci-nextiq-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # nextiq's own branches (main, dev-v2, prod, ...) don't map to
        # Frappe version branches the way they do in apps that branch
        # per-Frappe-version, so this is an explicit list rather than
        # derived from the branch name. Matches what pyproject.toml
        # declares support for (>=14.0.0,<17.0.0) — version-16 is current
        # stable, version-15 is the previous stable still in wide use.
        frappe-branch: [version-15, version-16]
    name: Server (${{ matrix.frappe-branch }})
    env:
      FRAPPE_BRANCH: ${{ matrix.frappe-branch }}

    services:
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379
      mariadb:
        image: mariadb:11.8
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - name: Clone
        uses: actions/checkout@v6

      - name: Check for valid Python & merge conflicts
        run: |
          python3 -m compileall -f "${GITHUB_WORKSPACE}"
          if grep -lr --exclude-dir=node_modules "^<<<<<<< " "${GITHUB_WORKSPACE}"; then
            echo "Found merge conflict markers"
            exit 1
          fi

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          # Frappe's version-16 branch pins requires-python to exactly
          # >=3.14,<3.15 — anything older can't even parse its source
          # (it uses PEP 695 `type X = ...` syntax, Python 3.12+ only).
          # version-15 is more permissive (>=3.10,<3.15), so 3.14 covers
          # both matrix legs.
          python-version: "3.14"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          # Frappe's package.json requires Node >=24 (confirmed against
          # frappe/payments' own CI, which uses 24) — bench init's yarn
          # install step fails outright on anything older.
          node-version: 24
          check-latest: true

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/*requirements.txt', '**/pyproject.toml', '**/setup.py', '**/setup.cfg') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            ${{ runner.os }}-

      - name: Install MariaDB Client
        run: |
          sudo apt update
          sudo apt-get install mariadb-client

      - name: Setup bench
        run: |
          pip install frappe-bench
          bench init --skip-redis-config-generation --skip-assets --python "$(which python)" --frappe-branch "$FRAPPE_BRANCH" ~/frappe-bench
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL character_set_server = 'utf8mb4'"
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL collation_server = 'utf8mb4_unicode_ci'"

      - name: Install apps
        working-directory: /home/runner/frappe-bench
        run: |
          bench get-app erpnext --branch "$FRAPPE_BRANCH"
          bench get-app nextiq $GITHUB_WORKSPACE
          bench setup requirements --dev
          bench new-site --db-root-password root --admin-password admin test_site
          bench --site test_site install-app erpnext
          bench --site test_site install-app nextiq
          bench build
        env:
          CI: "Yes"

      - name: Seed missing ERPNext default fixtures
        working-directory: /home/runner/frappe-bench
        # Neither `bench console` (interactive REPL, doesn't reliably run a
        # piped-in script) nor `bench execute` (resolves dotted paths via
        # frappe.get_attr, which requires an installed app name, not just an
        # importable module) can run a standalone script. env/bin/python can
        # call frappe.init()/connect() directly, same as any Frappe script.
        run: env/bin/python "$GITHUB_WORKSPACE/.github/ci/ensure_default_records.py" test_site

      - name: Run tests
        working-directory: /home/runner/frappe-bench
        run: |
          bench --site test_site set-config allow_tests true
          bench --site test_site run-tests --app nextiq
        env:
          TYPE: server
